# Netlify hosting (the Cloudflare Pages setup in wrangler.toml / functions/ keeps working side by side).
[build]
  command = "npm run build"
  publish = "dist/"
  functions = "netlify/functions"

# Feed pictures and video posters are resized + converted by Netlify Image CDN (see milkyway/app/core/media.js).
[images]
  remote_images = ["https://wpclkhgizbvxuvbhbwzs\\.supabase\\.co/storage/v1/.*"]

# The app shell modules are revalidated on each visit (the service worker serves them instantly meanwhile).
[[headers]]
  for = "/milkyway/app/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
